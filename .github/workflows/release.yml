name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            artifact: speakerlab-windows-x86_64
            binary: speakerlab.exe
          - name: linux-x86_64
            os: ubuntu-latest
            artifact: speakerlab-linux-x86_64
            binary: speakerlab
          - name: macos-aarch64
            os: macos-latest
            artifact: speakerlab-macos-aarch64
            binary: speakerlab

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.name }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.name }}-release-cargo-

      - name: Run tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release -p speakerlab

      - name: Stage files
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/${{ matrix.binary }} dist/
          cp README.md LICENSE dist/
          printf 'SpeakerLab on Linux needs GTK/X11 libraries at runtime:\n  sudo apt install libgtk-3-0 libxcb-render0 libxcb-shape0 libxkbcommon0\n' > dist/RUN-LINUX.txt

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath ${{ matrix.artifact }}.zip

      - name: Package (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: cd dist && zip -r ../${{ matrix.artifact }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Create release with binaries
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/**/*.zip
